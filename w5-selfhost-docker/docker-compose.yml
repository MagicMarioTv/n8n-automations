services:
    n8n:
        image: docker.n8n.io/n8nio/n8n
        restart: unless-stopped
        ports:
            - "5678:5678"
        environment:
            - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
            - GENERIC_TIMEZONE=America/New_York
            - TZ=America/New_York
        volumes:
            - n8n_data:/home/node/.n8n

volumes:
    n8n_data: 